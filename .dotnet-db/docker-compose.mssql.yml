services:
  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: dotnet-mssql
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "DevPass123!"
      MSSQL_PID: "Developer"
    ports:
      - "1433:1433"
    volumes:
      - dotnet-mssql-data:/var/opt/mssql
    restart: unless-stopped

volumes:
  dotnet-mssql-data:
